        titleEl.textContent = "WHERE THE BIG MONEY WENT";
        valApbd.textContent = "Rp 206.37B · 2.3%";
        valBank.textContent = "Rp 7.13T · 80.7%";
        valOther.textContent = "Rp 1.49T · 16.8%";
        valKpu.textContent = "Rp 15.53B · 0.2%";
      }

    // 14.0s -> 22.0s: Draw Chart 1 bars (scale relative to 45% max so 37.5% looks bold)
    tl.fromTo("#a2-bar-apbd", { scaleX: 0 }, { scaleX: 0.85, duration: 0.9, ease: "power4.out" }, 16.2);

    tl.fromTo("#a2-bar-bank", { scaleX: 0 }, { scaleX: 0.39, duration: 0.7, ease: "power4.out" }, 17.5);

    tl.fromTo("#a2-bar-apbd", { scaleX: 0.85 }, { scaleX: 0.05, duration: 1.0, ease: "power3.inOut", immediateRender: false }, 24.0);
    tl.fromTo("#a2-bar-other", { scaleX: 0.78 }, { scaleX: 0.21, duration: 0.9, ease: "power3.inOut", immediateRender: false }, 24.4);
    tl.fromTo("#a2-bar-kpu", { scaleX: 0.22 }, { scaleX: 0.02, duration: 0.8, ease: "power3.inOut", immediateRender: false }, 24.6);

    // 47.4s: Exit Charts -> Enter Banking 4-Case Ledger
    tl.fromTo("#a2-desk-charts", { opacity: 1, y: 0 }, { opacity: 0, y: -50, duration: 0.3, ease: "power3.in", immediateRender: false }, 47.25);
    tl.set("#a2-desk-charts", { visibility: "hidden" }, 47.58);

    tl.set("#a2-desk-banks", { visibility: "visible" }, 47.45);
    tl.fromTo("#a2-desk-banks", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.38, ease: "expo.out" }, 47.5);
    tl.fromTo("#a2-b1", { opacity: 0, x: -44 }, { opacity: 1, x: 0, duration: 0.38, ease: "power4.out" }, 47.7);
    tl.fromTo("#a2-b2", { opacity: 0, x: -44 }, { opacity: 1, x: 0, duration: 0.38, ease: "power4.out" }, 55.9);
    tl.fromTo("#a2-b3", { opacity: 0, x: -44 }, { opacity: 1, x: 0, duration: 0.38, ease: "power4.out" }, 63.2);
    tl.fromTo("#a2-b4", { opacity: 0, x: -44 }, { opacity: 1, x: 0, duration: 0.38, ease: "power4.out" }, 69.8);

    // 74.6s ("Outside banking..."): Exit Bank Ledger -> Split-View Host (edge-to-edge scale 1!) + S.A. Hajj Endowment Card
    tl.set("#a2-host-cam", { scale: 1, y: -230 }, 74.4);

    tl.set("#a2-desk-banks", { visibility: "hidden" }, 74.78);
